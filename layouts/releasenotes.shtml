<extend template="footer.shtml">
<main id="main-content">
	<h1 :text="$page.title"></h1>
	<div :html="$page.content()"></div>

	<div id="article-list" :loop="$page.subpages()">
		<article :if="$loop.it.isSection().not()">
			<a href="$loop.it.link()"></a>
			<h3>
				<a href="$loop.it.link()" :text="$loop.it.title"></a>
			</h3>
			<ctx :if="$loop.it.description.len().gt(0)">
				<p :text="$loop.it.description"></p>
			</ctx>
			<div class="details">
				<small>
					<time datetime="$loop.it.date.format('2006-01-02')"
						:text="$loop.it.date.format('January 02, 2006')"></time>
				</small>
			</div>
		</article>
		<article :if="$loop.it.isSection()">
			<a href="$loop.it.link()"></a>
			<h3>
				<a href="$loop.it.link()" :text="$loop.it.title"></a>
			</h3>
			<ul>
				<ctx :loop="$loop.it.subpages()">
					<li>
						<a href="$loop.it.link()" :text="$loop.it.title"></a>
					</li>
				</ctx>
			</ul>
		</article>
	</div>

	<ctx alt="$page.alternative('rss')">
		<p class="center">
			<a href="$ctx.alt.link()">RSS feed</a>
		</p>
	</ctx>
</main>
