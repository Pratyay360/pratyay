<extend template="footer.shtml">
	<main id="main">
		<article>
			<h1 :text="$page.title" class="txt-ctr"></h1>
			<div class="subtitle-wrp txt-ctr">
				<time class="fgshade3" :text="$page.date.format('January 02, 2006')"></time>
			</div>
			<div :html="$page.content()"></div>
		</article>

		<nav class="post-nav no-print" aria-label="Post navigation">
			<ctx :if="$page.prevPage?()">
				<a class="post-nav-card post-nav-prev" href="$if.link()" :title="$if.title">
					<span class="post-nav-dir">← Previous</span>
					<span class="post-nav-title" :text="$if.title"></span>
					<time class="post-nav-date" :text="$if.date.format('Jan 02, 2006')"></time>
				</a>
			</ctx>
			<ctx :if="$page.hasPrev().not()">
				<span class="post-nav-card post-nav-disabled" aria-hidden="true">
					<span class="post-nav-dir">← Previous</span>
					<span class="post-nav-title" style="opacity:.4">No previous post</span>
				</span>
			</ctx>
			<div class="post-nav-center">
				<a href="$page.parentSection().link()" title="Back to section">↑ All posts</a>
			</div>
			<ctx :if="$page.nextPage?()">
				<a class="post-nav-card post-nav-next" href="$if.link()" :title="$if.title">
					<span class="post-nav-dir">Next →</span>
					<span class="post-nav-title" :text="$if.title"></span>
					<time class="post-nav-date" :text="$if.date.format('Jan 02, 2006')"></time>
				</a>
			</ctx>
			<ctx :if="$page.hasNext().not()">
				<span class="post-nav-card post-nav-disabled" aria-hidden="true">
					<span class="post-nav-dir">Next →</span>
					<span class="post-nav-title" style="opacity:.4">No next post</span>
				</span>
			</ctx>
		</nav>
		<script>
			document.addEventListener('keydown', (e) => {
				if (e.target.closest('input, textarea, [contenteditable="true"]')) return;
				if (e.key === 'ArrowLeft') {
					const a = document.querySelector('a.post-nav-prev');
					if (a) window.location.href = a.href;
				}
				if (e.key === 'ArrowRight') {
					const a = document.querySelector('a.post-nav-next');
					if (a) window.location.href = a.href;
				}
			});
		</script>

		<div id="applause"></div>

		<script type="module">
			let initialized = false;
			const root = document.getElementById("applause");

			const observer = new IntersectionObserver(async ([entry]) => {
				if (!entry.isIntersecting || initialized) return;
				initialized = true;
				observer.disconnect();
				await import("https://unpkg.com/applause-button/dist/applause-button.js");
				const button = document.createElement("applause-button");
				button.setAttribute("color", "#d97706"); // amber
				button.setAttribute("multiclap", "");
				button.style.margin = "2rem auto";
				button.style.display = "block";

				root.appendChild(button);
			});

			observer.observe(root);
		</script>

		<div id="comments"></div>
		<div id="newsletter"></div>
		<script type="module" async>
			let initialized = false;
			const root = document.getElementById("comments");

			const observer = new IntersectionObserver(async ([entry]) => {
				if (!entry.isIntersecting || initialized) return;

				initialized = true;
				observer.disconnect();

				const script = document.createElement("script");
				script.src = "https://giscus.app/client.js";
				script.async = true;
				script.crossOrigin = "anonymous";

				// Set all required Giscus data attributes
				script.setAttribute("data-repo", "Pratyay360/blogs_md");
				script.setAttribute("data-repo-id", "R_kgDOTJV0_Q");
				script.setAttribute("data-category", "Show and tell");
				script.setAttribute("data-category-id", "DIC_kwDOTJV0_c4DB8i3");
				script.setAttribute("data-mapping", "pathname");
				script.setAttribute("data-strict", "0");
				script.setAttribute("data-reactions-enabled", "1");
				script.setAttribute("data-emit-metadata", "1");
				script.setAttribute("data-input-position", "top");
				script.setAttribute("data-theme", "gruvbox_dark");
				script.setAttribute("data-lang", "en");
				script.setAttribute("data-loading", "lazy");

				root.appendChild(script);
			});

			observer.observe(root);
		</script>
		<div class="txt-ctr" style="margin: 2rem 0;">
			<a href="https://github.com/Pratyay360/blogs_md/issues/1" target="_blank" rel="noopener noreferrer"
				style="display:inline-block;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-weight:600;line-height:1.25;text-align:center;text-decoration:none;cursor:pointer;padding:10px 20px;font-size:16px;border-radius:8px;background:#0969da;color:#ffffff;border:1px solid rgba(27, 31, 36, 0.15);box-shadow:none;transition:background .15s ease, transform .15s ease">Subscribe
				on GitHub</a>
		</div>
	</main>
