<extend template="footer.shtml">
<main id="main-content">
	<picture>
		<source srcset="$site.asset('404.png').link()" media="(prefers-reduced-motion: reduce)">
		<img id="not-found" alt="404" src="$site.asset('404.gif').link()">
	</picture>

	<h1 :text="$page.title"></h1>
	<div :html="$page.content()"></div>

	<p>The page you are looking for does not exist or got deleted.</p>

	<div class="buttons">
		<a href="$site.page('').link()">Go Home</a>
		<a href="/sitemap/">Sitemap</a>
		<a href="/search/">Search</a>
	</div>
</main>
