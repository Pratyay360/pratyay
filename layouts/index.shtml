<extend template="footer.shtml">
<main id="main">
	<h1 :text="$page.title" class="txt-ctr"></h1>
	<div :html="$page.content()"></div>
	<ctx alt="$page.alternative('rss-all')">
		<p class="txt-ctr">
			<a href="$ctx.alt.link()">RSS feed (all posts)</a>
			|
			<a href="$site.page('blog').alternative('rss').link()">Blog RSS</a>
			|
			<a href="$site.page('notes').alternative('rss').link()">Notes RSS</a>
		</p>
	</ctx>
	<section id="latest-posts">
		<h2 class="wt-600">Latest Posts</h2>
		<ul :loop="$site.page('blog').subpages()">
			<li>
				<time class="flt-r fgshade3 font-mono wt-300 ft-size-s"
				      datetime="$loop.it.date.format('2006-01-02')"
				      :text="$loop.it.date.format('Jan 02, 2006')"
				></time>
				<a class="wt-500" href="$loop.it.link()" :text="$loop.it.title"></a>
			</li>
		</ul>
	</section>
	<section id="notes">
		<h2 class="wt-600">Notes</h2>
		<ul :loop="$site.page('notes').subpages()">
			<li>
				<time class="flt-r fgshade3 font-mono wt-300 ft-size-s"
				      datetime="$loop.it.date.format('2006-01-02')"
				      :text="$loop.it.date.format('Jan 02, 2006')"
				></time>
				<a :text="$loop.it.title" class="wt-500" href="$loop.it.link()"></a>
			</li>
		</ul>
	</section>
</main>
