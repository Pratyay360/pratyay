<extend template="header.shtml">
	<main id="main">
		<super>
	</main>
	<footer id="footer">
		<div class="flx gap-l wt-600 flx-ctr">
			<div class="footer-buttons">
				<a href="https://notbyai.fyi/"><img src="$site.asset('buttons/by_human.svg').link()" alt="By Human"
						height="31"></a>
				<a href="$site.page('blog').link()"><img src="$site.asset('buttons/blogs.png').link()" alt="Blogs"
						width="88" height="31"></a>
				<a href="https://creativecommons.org/licenses/by-nc-sa/4.0/"><img
						src="$site.asset('buttons/cc.png').link()" alt="Creative Commons" width="88" height="31"></a>
				<a><img src="$site.asset('buttons/eyes.png').link()" alt="Eyes" width="88" height="31"></a>
				<a href="https://fedoraproject.org/"><img src="$site.asset('buttons/fedora.png').link()" alt="Fedora"
						width="88" height="31"></a>
				<a href="https://pratyay.goatcounter.com/"><img src="$site.asset('buttons/goat.png').link()"
						alt="GoatCounter" width="88" height="31"></a>
				<a href="https://www.kernel.org/"><img src="$site.asset('buttons/linoox.png').link()" alt="Linux"
						width="88" height="31"></a>
				<img src="$site.asset('buttons/milkandcookies.png').link()" alt="Milk and Cookies" width="88"
					height="31">
				<img src="$site.asset('buttons/nosmoking.png').link()" alt="No Smoking" width="88" height="31">
				<a href="$site.page('blog').alternative('rss').link()"><img src="$site.asset('buttons/rss.png').link()"
						alt="RSS Feed" width="88" height="31"></a>
			</div>
			<div>
				<a href="https://codeberg.org/Pratyay360/blogs_md" alt="get all the blogs"><span>Contents available
						at</span></a>
				<a></a>
			</div>
			<div>
				<link rel="preconnect" href="https://townsquare.cauenapier.com" crossorigin>
				<link rel="stylesheet" href="https://townsquare.cauenapier.com/widget.css">
				<div id="townsquare-root"></div>
				<script type="module" async>
					import { mountTownSquare } from "https://townsquare.cauenapier.com/townsquare.mjs";

					let triggered = false;
					const observer = new IntersectionObserver((entries) => {
						if (!triggered && entries[0].isIntersecting) {
							triggered = true;
							console.log('activating townsquare!');
							observer.disconnect();

							mountTownSquare(document.getElementById("townsquare-root"), {
								serverOrigin: "https://townsquare.cauenapier.com",
								siteKey: "site_yUlosxis4iwvEqt0",
								theme: "host"
							});
						}
					});
					observer.observe(document.getElementById('townsquare-root'));
				</script>
			</div>
		</div>
	</footer>
