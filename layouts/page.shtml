<extend template="footer.shtml">
<main id="main">
	<h1 :text="$page.title" class="txt-ctr"></h1>
	<div class="subtitle-wrp txt-ctr">
		<ctx :if="$page.custom.get?('subtitle')">
			<span :text="$if" class="fgshade1"></span><br>
		</ctx>
		<time class="fgshade3"
		      :text="$page.date.format('January 02, 2006')"
		></time>
	</div>
	<ctx :if="$page.custom.get?('toc')">
		<details>
			<summary>Table of Contents</summary>
			<ctx :html="$page.toc()"></ctx>
		</details>
	</ctx>
	<div class="post" :html="$page.content()"></div>
	<ctx :if="$page.footnotes?()">
		<ol :loop="$if">
			<li id="$loop.it.def_id">
				<ctx :html="$loop.it.html()"></ctx>
				<ctx :loop="$loop.it.ref_ids">
					<a href="$loop.it.prefix('#')">⤴</a>
				</ctx>
			</li>
		</ol>
	</ctx>
	<div class="no-print">
		<ctx :if="$page.tags.empty.not()">
			<p :loop="$page.tags" class="flex gap no-print ft-size-s">
				<span :text="$loop.it.prefix('#')" class="italic fgshade3"></span>
			</p>
		</ctx>
		<ctx :if="$page.parentSection().link().eql('/').not()">
		<nav class="post-nav" aria-label="Post navigation">
			<ctx :if="$page.prevPage?()">
				<a class="post-nav-card post-nav-prev" href="$if.link()" :title="$if.title">
					<span class="post-nav-dir">← Previous</span>
					<span class="post-nav-title" :text="$if.title"></span>
					<time class="post-nav-date" :text="$if.date.format('Jan 02, 2006')"></time>
				</a>
			</ctx>
			<ctx :if="$page.hasPrev().not()">
				<span class="post-nav-card post-nav-disabled" aria-hidden="true">
					<span class="post-nav-dir">← Previous</span>
					<span class="post-nav-title" style="opacity:.4">No previous post</span>
				</span>
			</ctx>
			<div class="post-nav-center">
				<a href="$page.parentSection().link()" title="Back to section">↑ All</a>
				<span style="opacity:.3; margin:0 4px">·</span>
				<a href="#" title="Back to top">Top</a>
			</div>
			<ctx :if="$page.nextPage?()">
				<a class="post-nav-card post-nav-next" href="$if.link()" :title="$if.title">
					<span class="post-nav-dir">Next →</span>
					<span class="post-nav-title" :text="$if.title"></span>
					<time class="post-nav-date" :text="$if.date.format('Jan 02, 2006')"></time>
				</a>
			</ctx>
			<ctx :if="$page.hasNext().not()">
				<span class="post-nav-card post-nav-disabled" aria-hidden="true">
					<span class="post-nav-dir">Next →</span>
					<span class="post-nav-title" style="opacity:.4">No next post</span>
				</span>
			</ctx>
		</nav>
		<script>
			document.addEventListener('keydown', (e) => {
				if (e.target.closest('input, textarea, [contenteditable="true"]')) return;
				if (e.key === 'ArrowLeft') {
					const a = document.querySelector('a.post-nav-prev');
					if (a) window.location.href = a.href;
				}
				if (e.key === 'ArrowRight') {
					const a = document.querySelector('a.post-nav-next');
					if (a) window.location.href = a.href;
				}
			});
		</script>
		</ctx>
	</div>
</main>
