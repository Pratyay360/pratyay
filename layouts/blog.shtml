<extend template="footer.shtml">
<main id="main-content" class="h-feed">
	<h1 :text="$page.title"></h1>
	<a class="p-author h-card u-url" href="$site.host_url" style="display:none" rel="author">Pratyay Mustafi</a>
	<div :html="$page.content()"></div>

	<p>
		<small>
			<span :text="$page.subpages().len"></span>
			posts in total
		</small>
	</p>

	<div id="article-list" :loop="$page.subpages()">
		<article class="h-entry">
			<a href="$loop.it.link()"></a>
			<h3>
				<a class="u-url p-name" href="$loop.it.link()" :text="$loop.it.title"></a>
			</h3>
			<ctx :if="$loop.it.description.len().gt(0)">
				<p class="p-summary" :text="$loop.it.description"></p>
			</ctx>
			<div class="details">
				<small>
					<time class="dt-published" datetime="$loop.it.date.format('2006-01-02')"
						:text="$loop.it.date.format('January 02, 2006')"></time>
				</small>
			</div>
		</article>
	</div>

	<ctx alt="$page.alternative('rss')">
		<p class="center">
			<a href="$ctx.alt.link()">RSS feed</a>
		</p>
	</ctx>
</main>
