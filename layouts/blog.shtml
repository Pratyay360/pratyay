<extend template="footer.shtml">
<main id="main" class="h-feed">
	<h1 :text="$page.title" class="txt-ctr p-name"></h1>
	<a class="p-author h-card u-url" href="$site.host_url" style="display:none" rel="author">Pratyay Mustafi</a>
	<ctx :html="$page.content()"></ctx>

	<h2 class="wt-600">Latest Posts</h2>
	<ul :loop="$page.subpages()">
		<li class="h-entry">
			<time class="flt-r fgshade3 font-mono wt-300 ft-size-s dt-published"
			      datetime="$loop.it.date.format('2006-01-02')"
			      :text="$loop.it.date.format('Jan 02, 2006')"
			></time>
			<a class="wt-500 u-url p-name" href="$loop.it.link()" :text="$loop.it.title"></a>
			<br>
			<span :text="$loop.it.description" class="italic fgshade2 ft-size-s p-summary"></span>
		</li>
	</ul>
	<ctx alt="$page.alternative('rss')">
		<p class="txt-ctr">
			<a href="$ctx.alt.link()">RSS feed</a>
		</p>
	</ctx>

</main>
