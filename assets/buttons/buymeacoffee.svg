<svg xmlns="http://www.w3.org/2000/svg" width="88" height="31" viewBox="0 0 88 31">
  <defs>
    <clipPath id="corner-clip">
      <path d="M 1 0 L 87 0 L 88 1 L 88 30 L 87 31 L 1 31 L 0 30 L 0 1 Z" />
    </clipPath>
  </defs>

  <g clip-path="url(#corner-clip)">
    <!-- Outer border background -->
    <rect width="88" height="31" fill="#121214"/>

    <!-- Right text panel background -->
    <rect x="28" y="1" width="59" height="29" fill="#18181b"/>
    <!-- Right panel bevel -->
    <line x1="29" y1="1" x2="86" y2="1" stroke="#38383e" stroke-width="1"/>
    <line x1="29" y1="29" x2="86" y2="29" stroke="#09090b" stroke-width="1"/>
    <line x1="86" y1="1" x2="86" y2="29" stroke="#09090b" stroke-width="1"/>

    <!-- Left icon panel (BMC Yellow) -->
    <rect x="1" y="1" width="27" height="29" fill="#FFDD00"/>
    <!-- Left panel bevel -->
    <line x1="1" y1="1" x2="27" y2="1" stroke="#FFF275" stroke-width="1"/>
    <line x1="1" y1="1" x2="1" y2="29" stroke="#FFF275" stroke-width="1"/>
    <line x1="1" y1="29" x2="27" y2="29" stroke="#C9A600" stroke-width="1"/>
    <line x1="27" y1="1" x2="27" y2="29" stroke="#C9A600" stroke-width="1"/>

    <!-- Divider between left and right -->
    <line x1="28" y1="0" x2="28" y2="31" stroke="#000000" stroke-width="1"/>

    <!-- Coffee Icon (Centered around x=14.5, y=15.5) -->
    <g transform="translate(6.5, 6)">
      <!-- Steam -->
      <path d="M 5 3.5 C 5 2 6.5 2 6.5 0.5" stroke="#000000" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <path d="M 9 4 C 9 2.5 10.5 2.5 10.5 1" stroke="#000000" stroke-width="1.1" stroke-linecap="round" fill="none"/>
      <!-- Cup body -->
      <path d="M 1.5 5.5 L 12.5 5.5 C 12.5 5.5 12.5 13 7 13 C 1.5 13 1.5 5.5 1.5 5.5 Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.2" stroke-linejoin="round"/>
      <!-- Coffee surface -->
      <ellipse cx="7" cy="6.5" rx="4.5" ry="1" fill="#5D4037"/>
      <!-- Handle -->
      <path d="M 12 7 C 14.8 7 14.8 10.5 11.8 10.5" fill="none" stroke="#000000" stroke-width="1.2" stroke-linecap="round"/>
      <!-- Saucer -->
      <line x1="0.5" y1="15" x2="13.5" y2="15" stroke="#000000" stroke-width="1.2" stroke-linecap="round"/>
    </g>

    <!-- Right text -->
    <text x="58" y="12" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7" font-weight="700" fill="#E4E4E7" letter-spacing="0.3">BUY ME A</text>
    <text x="58" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="900" fill="#FFDD00" letter-spacing="0.7">COFFEE</text>
  </g>
</svg>
