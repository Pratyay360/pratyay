[tools]
fd = "latest"
"github:kristoff-it/ziggy" = "latest"
"github:kristoff-it/zine" = "latest"
"github:neurocyte/flow" = "latest"
"github:pratyay360/md2smd" = "main"
"go:github.com/yieldray/surgecli" = "latest"
node = "latest"
superhtml = "latest"
wrangler = { version = "latest", allow_builds = ["esbuild", "sharp", "workerd"] }

[settings]
experimental = true


[tasks.fetch]
run = "node scripts/fetch.js"
description = "fetch the latest posts"

[tasks.build]
run = ["zine release -f", "npx -y pagefind --site public"]
description = "build the site"

[tasks.dev]
run = "zine"
description = "start the dev server"

[tasks.deploy-cf]
run = "wrangler pages deploy public/ --project-name pratyay"
description = "deploy the site"

[tasks.deploy]
run = "surgecli upload public/ pratyay.bond"
description = "purge the site"
