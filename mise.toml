[tools]
argc = "latest"
"github:kristoff-it/ziggy" = "latest"
"github:kristoff-it/zine" = "latest"
"github:neurocyte/flow" = "latest"
"github:light-cms/md2smd" = "latest"
"github:sass/dart-sass" = "latest"
node = "24"
"npm:surge" = "latest"
superhtml = "latest"
"npm:parcel" = "latest"
bun = "latest"
"npm:pagefind" = "latest"
biome = "latest"
prettier = "latest"
# wrangler = { version = "latest", allow_builds = ["esbuild", "sharp", "workerd"] }

[settings]
experimental = true


[tasks.fetch]
run = "bun scripts/fetch.js"
description = "fetch the latest posts"

[tasks.build]
run = ["mise fetch", "zine release -f", "bun install", "bun run build", "pagefind --site public"]
description = "build the site"

[tasks.dev]
run = "zine"
description = "start the dev server"

# [tasks.deploy]
# run = "wrangler pages deploy public/ --project-name pratyay"
# description = "deploy the site"


# [tasks.deploy1]
# run = "surge public/ publish pratyay.online"
# description = "deploy the site"


[tasks.deploy]
run = [
    "mise run build",
    "surge public/ publish",
]
description = "deploy the site"
