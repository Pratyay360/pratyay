[tools]
argc = "latest"
"github:kristoff-it/ziggy" = "latest"
"github:kristoff-it/zine" = "latest"
"github:neurocyte/flow" = "latest"
"github:pratyay360/md2smd" = "1.6"
"github:sass/dart-sass" = "latest"
node = "24"
"npm:surge" = "latest"
superhtml = "latest"

[settings]
experimental = true


[tasks.fetch]
run = "node scripts/fetch.js"
description = "fetch the latest posts"

[tasks.build]
run = ["mise fetch", "zine release -f", "npx -y pagefind --site public"]
description = "build the site"

[tasks.dev]
run = "zine"
description = "start the dev server"

[tasks.deploy-cf]
run = "wrangler pages deploy public/ --project-name pratyay"
description = "deploy the site"


[tasks.deploy1]
run = "surge public/ publish www.pratyay.qzz.io"
description = "deploy the site"


[tasks.deploy]
run = [
    "surge public/ publish pratyay.online",
]
description = "deploy the site"
